name: Lint Charts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-matrix:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        helm-version:
          - "v4.0.5"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup
        uses: $/.github/actions/setup
        with:
          create-kind-cluster: "false"
          helm-version: ${{ matrix.helm-version }}

      - name: Run chart-testing (lint)
        run: "ct lint --target-branch main
          --chart-repos opentelemetry-collector=https://open-telemetry.github.io/opentelemetry-helm-charts
          --chart-repos prometheus=https://prometheus-community.github.io/helm-charts
          --chart-repos grafana=https://grafana-community.github.io/helm-charts
          --chart-repos jaeger=https://jaegertracing.github.io/helm-charts
          --chart-repos opensearch=https://opensearch-project.github.io/helm-charts"

      - name: Run make check-examples
        run: make check-examples

  helm-docs:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install helm-docs
        run: make install-helm-docs

      # Re-generates the chart READMEs and fails if that produces a diff, so a
      # README that no longer matches its values.yaml or README.md.gotmpl cannot merge.
      - name: Run make check-docs
        run: make check-docs

  lint-test:
    if: always()
    runs-on: ubuntu-slim
    needs: [lint-test-matrix]
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.lint-test-matrix.result }}" == "success" ]]; then
            echo "All matrix jobs passed!"
          else
            echo "One or more matrix jobs failed."
            exit 1
          fi
