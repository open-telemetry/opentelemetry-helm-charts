---
# Source: opentelemetry-otap-dataflow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-opentelemetry-otap-dataflow
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-otap-dataflow-0.1.0
    app.kubernetes.io/name: opentelemetry-otap-dataflow
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.50.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: opentelemetry
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-otap-dataflow
      app.kubernetes.io/instance: example
  template:
    metadata:
      annotations:
        checksum/config: 59c02aac82007afe88273f36d48f94ff64d36faaae866379ce0418274bb6ff92
      labels:
        app.kubernetes.io/name: opentelemetry-otap-dataflow
        app.kubernetes.io/instance: example
        app.kubernetes.io/component: engine
    spec:
      serviceAccountName: example-opentelemetry-otap-dataflow
      containers:
        - name: df-engine
          image: ghcr.io/isitobservable/df_engine:0.50.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/nonroot/df_engine
          args:
            - --config
            - /etc/otap/config.yaml
            - --http-admin-bind
            - 0.0.0.0:8080
          ports:
            - name: admin
              containerPort: 8080
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otap
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: example-opentelemetry-otap-dataflow
