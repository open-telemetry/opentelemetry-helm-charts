suite: cache deployment
templates:
  - templates/cache-deployment.yaml
tests:
  - it: uses an existing service account when creation is disabled
    set:
      serviceAccount:
        create: false
        name: existing-obi
      k8sCache:
        replicas: 1
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-obi

  - it: uses the default service account when creation is disabled without a name
    set:
      serviceAccount:
        create: false
      k8sCache:
        replicas: 1
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: renders cache deployment when k8sCache.replicas is set
    set:
      k8sCache:
        replicas: 1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: opentelemetry-ebpf-instrumentation-k8s-cache
      - equal:
          path: spec.replicas
          value: 1

  - it: does not render when k8sCache.replicas is 0
    set:
      k8sCache:
        replicas: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: renders scheduling options when set
    set:
      k8sCache:
        replicas: 1
        priorityClassName: system-cluster-critical
        nodeSelector:
          role: system
        tolerations:
          - key: role
            operator: Equal
            value: system
            effect: NoSchedule
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: '{{ .Values.k8sCache.service.name }}'
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            role: system
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: role
              operator: Equal
              value: system
              effect: NoSchedule
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: opentelemetry-ebpf-instrumentation-k8s-cache

  - it: does not inherit top-level scheduling options
    set:
      priorityClassName: system-node-critical
      nodeSelector:
        role: worker
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity: {}
      k8sCache:
        replicas: 1
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
