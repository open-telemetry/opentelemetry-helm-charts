suite: cache service
templates:
  - templates/cache-service.yaml
tests:
  - it: merges shared and cache service annotations with cache precedence and renders templates
    release:
      name: obi
      namespace: observability
    set:
      env:
        REVIEW_OWNER: "Ervin's team"
      service:
        annotations:
          example.com/component: agent
          example.com/shared: '{{ .Release.Namespace }}'
          example.com/shared-owner: '{{ .Values.env.REVIEW_OWNER }}'
      k8sCache:
        replicas: 1
        service:
          annotations:
            example.com/component: cache
            example.com/release: '{{ .Release.Name }}'
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/component: cache
            example.com/shared: observability
            example.com/shared-owner: "Ervin's team"
            example.com/release: obi

  - it: preserves cache annotation strings after template evaluation
    release:
      name: obi
    set:
      env:
        REVIEW_OWNER: "Ervin's team"
      k8sCache:
        replicas: 1
        service:
          annotations:
            example.com/owner: '{{ .Values.env.REVIEW_OWNER }}'
            example.com/multiline: '{{ printf "first\nsecond" }}'
            example.com/boolean: '{{ print "true" }}'
            example.com/number: '{{ print "123" }}'
            'example.com/{{ .Release.Name }}': '{{ print "" }}'
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: "Ervin's team"
            example.com/multiline: "first\nsecond"
            example.com/boolean: "true"
            example.com/number: "123"
            example.com/obi: ""

  - it: inherits shared service annotations when cache annotations are empty
    set:
      service:
        annotations:
          example.com/component: agent
      k8sCache:
        replicas: 1
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/component: agent

  - it: renders cache service when replicas are set
    set:
      k8sCache:
        replicas: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentelemetry-ebpf-instrumentation-k8s-cache
      - equal:
          path: spec.ports[0].port
          value: 50055
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-opentelemetry-ebpf-instrumentation-k8s-cache
      - notExists:
          path: metadata.annotations

  - it: does not render when replicas disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: gives each release its own cache name
    release:
      name: obi-b
    set:
      k8sCache:
        replicas: 1
    asserts:
      - equal:
          path: metadata.name
          value: obi-b-opentelemetry-ebpf-instrumentation-k8s-cache
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: obi-b-opentelemetry-ebpf-instrumentation-k8s-cache

  - it: keeps the previous default name for a release named after the chart
    release:
      name: opentelemetry-ebpf-instrumentation
    set:
      k8sCache:
        replicas: 1
    asserts:
      - equal:
          path: metadata.name
          value: opentelemetry-ebpf-instrumentation-k8s-cache

  - it: uses an explicit cache name
    release:
      name: obi-b
    set:
      k8sCache:
        replicas: 1
        service:
          name: my-cache
    asserts:
      - equal:
          path: metadata.name
          value: my-cache
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: my-cache

  - it: keeps the derived cache name within 63 characters
    release:
      name: a-very-long-release-name-that-is-fifty-three-chars-x
    set:
      k8sCache:
        replicas: 1
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^[a-z0-9][-a-z0-9]{0,52}-k8s-cache$'
