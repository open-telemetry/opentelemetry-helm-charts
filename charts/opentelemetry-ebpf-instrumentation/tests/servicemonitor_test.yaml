suite: servicemonitor
templates:
  - templates/servicemonitor.yaml
tests:
  - it: renders service monitor when enabled with service
    set:
      service:
        enabled: true
      serviceMonitor:
        enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.jobLabel
          value: RELEASE-NAME-opentelemetry-ebpf-instrumentation

  - it: allows overriding the Config v2 Prometheus endpoint path
    set:
      service:
        enabled: true
      serviceMonitor:
        enabled: true
        metrics:
          endpoint:
            path: /custom-metrics
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /custom-metrics

  - it: adds internal metrics endpoint when configured
    set:
      service:
        enabled: true
        internalMetrics:
          port: 8080
      serviceMonitor:
        enabled: true
        jobLabel: ebpf-int
      config:
        data:
          prometheus_export:
            port: 9090
            path: /metrics
          internal_metrics:
            prometheus:
              port: 6060
              path: /intmetrics
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[1].port
          value: int-metrics
      - equal:
          path: spec.endpoints[1].path
          value: /intmetrics
      - equal:
          path: spec.jobLabel
          value: ebpf-int

  - it: derives the internal metrics endpoint from Config v2
    set:
      service:
        enabled: true
      serviceMonitor:
        enabled: true
      config:
        data:
          extensions:
            obi:
              version: "2.0"
              daemon:
                internal_metrics:
                  exporter: prometheus
                  prometheus:
                    port: 6060
                    path: /obi-internal
    asserts:
      - equal:
          path: spec.endpoints[1].port
          value: int-metrics
      - equal:
          path: spec.endpoints[1].path
          value: /obi-internal
