suite: configmap
templates:
  - templates/configmap.yaml
tests:
  - it: renders default configmap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opentelemetry-ebpf-instrumentation

  - it: does not render when config creation disabled
    set:
      config:
        create: false
        name: external-config
    asserts:
      - hasDocuments:
          count: 0

  - it: omits prometheus_export when no Service can scrape it
    asserts:
      - notMatchRegex:
          path: data["ebpf-instrument-config.yml"]
          pattern: prometheus_export

  - it: keeps prometheus_export when a Service is enabled
    set:
      service:
        enabled: true
    asserts:
      - matchRegex:
          path: data["ebpf-instrument-config.yml"]
          pattern: prometheus_export

  - it: omits prometheus_export when only a ServiceMonitor is enabled
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - notMatchRegex:
          path: data["ebpf-instrument-config.yml"]
          pattern: prometheus_export

