---
# Source: opentelemetry-kube-stack/templates/exporters/kube-scheduler/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: example-kube-scheduler
  namespace: default
  labels:
    app: opentelemetry-kube-stack-kube-scheduler
    helm.sh/chart: opentelemetry-kube-stack-0.24.0
    app.kubernetes.io/version: "0.159.0"
    app.kubernetes.io/managed-by: Helm
    release: "example"
spec:
  jobLabel: jobLabel
  
  selector:
    matchLabels:
      app: opentelemetry-kube-stack-kube-scheduler
      release: "example"
  namespaceSelector:
    matchNames:
      - "kube-system"
  endpoints:
  - port: http-metrics
    authorization:
      credentials:
        key: token
        name: 'example-kubernetes-metrics-token'
      type: Bearer
    scheme: https
    tlsConfig:
      ca:
        configMap:
          key: ca.crt
          name: kube-root-ca.crt
      insecureSkipVerify: true
