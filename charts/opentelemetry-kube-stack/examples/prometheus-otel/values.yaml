clusterName: demo
opentelemetry-operator:
  manager:
    featureGatesMap:
      operator.targetallocator.fallbackstrategy: true
collectors:
  daemon:
    enabled: true
    # because this file is inside the examples folder, we need to reference it directly.
    scrape_configs_file: "examples/prometheus-otel/kubelet_scrape_configs.yaml"
    # Adding an additional label for this collctor.
    labels:
      otel-collector-type: daemonset-example
    targetAllocator:
      enabled: true
      image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:main
      allocationStrategy: per-node
      mtls:
        enabled: true
        useCertManager: true
      prometheusCR:
        enabled: true
        denyFSAccessThroughSMs: true
        podMonitorSelector: {}
        scrapeInterval: "30s"
        serviceMonitorSelector: {}
    config:
      exporters:
        otlp:
          endpoint: ingest.example.com:443
          headers:
            "access-token": "${ACCESS_TOKEN}"
      service:
        pipelines:
          metrics:
            receivers: [prometheus]
            exporters: [debug, otlp]
    env:
      - name: ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            key: access_token
            name: otel-collector-secret
    presets:
      logsCollection:
        enabled: false
      kubeletMetrics:
        enabled: false
      hostMetrics:
        enabled: false
      kubernetesAttributes:
        enabled: false
      kubernetesEvents:
        enabled: false
      clusterMetrics:
        enabled: false
instrumentation:
  enabled: false
opAMPBridge:
  enabled: false
kubernetesServiceMonitors:
  enabled: true
  authorization:
    create: true
kubeApiServer:
  enabled: true
  tlsConfig:
    ca:
      configMap:
        name: kube-root-ca.crt
        key: ca.crt
  serviceMonitor:
    authorization:
      type: Bearer
      credentials:
        name: '{{ include "opentelemetry-kube-stack.kubernetesMetrics.tokenSecretName" . }}'
        key: token
kubelet:
  enabled: true
kubeControllerManager:
  enabled: true
  serviceMonitor:
    authorization:
      type: Bearer
      credentials:
        name: '{{ include "opentelemetry-kube-stack.kubernetesMetrics.tokenSecretName" . }}'
        key: token
    tlsConfig:
      ca:
        configMap:
          name: kube-root-ca.crt
          key: ca.crt
kubeDns:
  enabled: true
  serviceMonitor:
    authorization: null
kubeEtcd:
  enabled: true
  serviceMonitor:
    authorization: null
kubeScheduler:
  enabled: true
  serviceMonitor:
    authorization:
      type: Bearer
      credentials:
        name: '{{ include "opentelemetry-kube-stack.kubernetesMetrics.tokenSecretName" . }}'
        key: token
    tlsConfig:
      ca:
        configMap:
          name: kube-root-ca.crt
          key: ca.crt
kubeProxy:
  enabled: true
  serviceMonitor:
    authorization: null
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
coreDns:
  serviceMonitor:
    authorization: null
