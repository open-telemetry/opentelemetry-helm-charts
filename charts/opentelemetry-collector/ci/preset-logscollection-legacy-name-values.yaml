mode: daemonset

image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"

command:
  name: "otelcol-k8s"

rewriteDeprecatedComponentNames: false

presets:
  logsCollection:
    enabled: true

config:
  receivers:
    filelog:
      exclude:
        - /var/log/pods/extra-exclude_*/*/*.log

resources:
  limits:
    cpu: 100m
    memory: 200M
