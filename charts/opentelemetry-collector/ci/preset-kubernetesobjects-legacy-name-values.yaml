mode: deployment

image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"

command:
  name: "otelcol-k8s"

rewriteDeprecatedComponentNames: false

presets:
  kubernetesObjects:
    enabled: true

config:
  receivers:
    k8sobjects:
      objects:
        - name: leases
          group: coordination.k8s.io
          mode: pull

resources:
  limits:
    cpu: 100m
    memory: 200M
